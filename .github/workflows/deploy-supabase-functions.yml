name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # The project ref is not a secret — it is the first line of
      # supabase/config.toml and it is in every API URL the client ships. Every
      # run from 2026-05-15 to 2026-09-06 failed because this was wired to an
      # unset repository secret and the CLI then reported "Cannot find project
      # ref", so nothing has deployed from CI in four months. The secret still
      # wins if it is set; otherwise fall back to config.toml.
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve project ref
        run: |
          set -euo pipefail
          ref="${SUPABASE_PROJECT_REF:-}"
          if [ -z "$ref" ]; then
            ref="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' supabase/config.toml)"
            echo "SUPABASE_PROJECT_REF unset; using project_id from supabase/config.toml"
          fi
          if [ -z "$ref" ]; then
            echo "::error::No project ref. Set the SUPABASE_PROJECT_REF secret or project_id in supabase/config.toml."
            exit 1
          fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"

      # Fails loudly rather than letting every deploy step fail one at a time
      # with an authentication error that reads like a project-ref problem.
      - name: Check access token is present
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at https://supabase.com/dashboard/account/tokens and add it as a repository secret."
            exit 1
          fi

      - name: Deploy ai-coach
        run: supabase functions deploy ai-coach --project-ref "$PROJECT_REF"

      - name: Deploy generate-program
        run: supabase functions deploy generate-program --project-ref "$PROJECT_REF"

      - name: Deploy grant-tokens
        run: supabase functions deploy grant-tokens --project-ref "$PROJECT_REF"
